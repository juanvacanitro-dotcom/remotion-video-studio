name: Render rebuilt GTA VI scenes 1-4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/compositions/GTA6Scenes1to4.tsx'
      - '.github/workflows/render-scenes-1-4.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install tools
        run: |
          pip install gdown
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download original narrations
        run: |
          mkdir -p public/media out
          gdown 'https://drive.google.com/uc?id=1tRiOV8LjqZmHMqjcM5zwZ79q9bxjSyNv' -O /tmp/v1.mp3
          gdown 'https://drive.google.com/uc?id=15Muh9JO_rZQNnbKz03rRuhmEHNeCFyFk' -O /tmp/v2.mp3
          gdown 'https://drive.google.com/uc?id=19BKQcWl5u-JQ-RdVMS5XUe5Lz9LkMMN3' -O /tmp/v3.mp3
          gdown 'https://drive.google.com/uc?id=1NZT8FXrTAByLRcbrdYeHAWP1GfxCP78D' -O /tmp/v4.mp3
          for i in 1 2 3 4; do dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/v$i.mp3); fade=$(python -c "print(max(0,float('$dur')-0.12))"); ffmpeg -y -i /tmp/v$i.mp3 -af "loudnorm=I=-16:TP=-1.5:LRA=7,afade=t=in:st=0:d=0.08,afade=t=out:st=$fade:d=0.12" -ar 48000 -ac 2 -c:a pcm_s16le public/media/voice-$i.wav; done
      - run: npm install
      - run: npx remotion browser ensure
      - name: Render complete first four scenes
        run: npx remotion render src/index.ts GTA6Scenes1to4 out/GTA6-ZINKO-Scenes-1-4-R2.mp4 --codec=h264 --crf=17
      - name: Validate duration and audio
        run: |
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/GTA6-ZINKO-Scenes-1-4-R2.mp4
          test $(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 out/GTA6-ZINKO-Scenes-1-4-R2.mp4 | wc -l) -eq 1
      - uses: actions/upload-artifact@v4
        with: {name: GTA6-ZINKO-Scenes-1-4-R2, path: out/GTA6-ZINKO-Scenes-1-4-R2.mp4, retention-days: 14}
