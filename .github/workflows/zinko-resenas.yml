name: Render Zinko reviews first three clips
on:
  push:
    branches: [codex/zinko-resenas-01-03]
    paths: ['src/zinko-resenas/**', 'public/zinko-resenas/**', '.github/workflows/zinko-resenas.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zinko-resenas-01-03
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx remotion browser ensure
      - run: npx remotion render src/zinko-resenas/index.tsx ZinkoResenas out/ZINKO-Resenas-01-03.mp4 --concurrency=2 --crf=18 --pixel-format=yuv420p --audio-bitrate=256k
      - uses: actions/upload-artifact@v4
        with:
          name: ZINKO-Resenas-01-03
          path: out/ZINKO-Resenas-01-03.mp4
          if-no-files-found: error
          retention-days: 14
