name: Render ZINKO Entrar a GTA6 - V2 Dinamico
on:
  push:
    branches: [codex/zinko-entrar-gta6]
    paths: ['src/zinko-entrar/**', 'public/zinko-entrar/**', '.github/workflows/zinko-entrar.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zinko-entrar-avance-01
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python3 src/zinko-entrar/build_fast.py
      - run: npx tsc --noEmit
      - run: npx remotion browser ensure
      - name: Render dynamic first three scenes
        run: npx remotion render src/zinko-entrar/index-fast.tsx ZinkoEntrarV2Dinamico out/ZINKO-Entrar-GTA6-V2-Dinamico.mp4 --concurrency=2 --crf=18 --pixel-format=yuv420p --audio-bitrate=256k
      - name: Check video
        run: |
          ffmpeg -v error -i out/ZINKO-Entrar-GTA6-V2-Dinamico.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height,r_frame_rate -of json out/ZINKO-Entrar-GTA6-V2-Dinamico.mp4 > out/media-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: ZINKO-Entrar-GTA6-V2-Dinamico
          path: out/
          if-no-files-found: error
          retention-days: 30
