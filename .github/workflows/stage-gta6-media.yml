name: Stage verified GTA VI source media
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download verified files from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/video staging/docs
          gdown "https://drive.google.com/uc?id=1CLjql_xDTMiIGUc8OIbzTim9yDrYlVMC" -O staging/video/01.mp4
          gdown "https://drive.google.com/uc?id=1siKgGbFWqKXH2xwm4mn8AAxB3CLzGim-" -O staging/video/02.mp4
          gdown "https://drive.google.com/uc?id=1W66LxrTw1he1lkAsfxP6sux9wxBLYXt-" -O staging/video/03.mp4
          gdown "https://drive.google.com/uc?id=1jKbONQjBByhi8T-vW_EZPsQggwSbtF3_" -O staging/video/R7-reference.mp4
          gdown "https://drive.google.com/uc?id=1CAMEylHzLqUrXDjLJ7Ttnp5hNtS2jrdn" -O staging/docs/GTA6-script.docx
      - name: Validate media and create contact sheets
        shell: bash
        run: |
          set -euo pipefail
          for f in staging/video/*.mp4; do
            echo "===== $f ====="
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f"
            mkdir -p "staging/frames/$(basename "$f" .mp4)"
            ffmpeg -hide_banner -loglevel error -i "$f" -vf "fps=1/3,scale=320:-1,tile=3x3" -frames:v 1 "staging/frames/$(basename "$f" .mp4).jpg"
          done
          find staging -type f -printf '%p %s bytes\n' | sort
      - name: Package verified source media
        run: zip -qr GTA6-R8-verified-media.zip staging
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-R8-verified-media
          path: GTA6-R8-verified-media.zip
          retention-days: 7
