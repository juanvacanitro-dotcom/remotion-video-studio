name: Render GTA VI R8 with FFmpeg (no Remotion)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_r8_ffmpeg.py'
      - '.github/workflows/render-r8-ffmpeg.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg, fonts and editing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core unzip
          pip install --upgrade gdown pillow numpy faster-whisper
      - name: Download the user's narration, assets, original clips and sound effects
        run: |
          mkdir -p work/media work/assets work/stills work/lineart work/clips work/rockstar/clips work/sfx work/out
          gdown 'https://drive.google.com/uc?id=1tRiOV8LjqZmHMqjcM5zwZ79q9bxjSyNv' -O work/media/voice-1.mp3
          gdown 'https://drive.google.com/uc?id=15Muh9JO_rZQNnbKz03rRuhmEHNeCFyFk' -O work/media/voice-2.mp3
          gdown 'https://drive.google.com/uc?id=19BKQcWl5u-JQ-RdVMS5XUe5Lz9LkMMN3' -O work/media/voice-3.mp3
          gdown 'https://drive.google.com/uc?id=1NZT8FXrTAByLRcbrdYeHAWP1GfxCP78D' -O work/media/voice-4.mp3
          gdown 'https://drive.google.com/uc?id=1SdoozbJgN_8RQoRyyAx1vZIvNlvCZPr5' -O work/assets/Nico.jpg
          gdown 'https://drive.google.com/uc?id=1VeEa0Cmt1F4Vf38pt40CWBkiPNJ5NYoV' -O work/assets/Style-Key.jpg
          gdown 'https://drive.google.com/uc?id=1TbX-srtQLaOojT-UKD4Qjb8kAFYEF7AQ' -O work/assets/Sala-Gamer.jpg
          gdown 'https://drive.google.com/uc?id=10m7MY2TBd43kP9yul3KhOhUt7TyxroHg' -O work/assets/Escenario-Datos.jpg
          gdown 'https://drive.google.com/uc?id=16_OqDxawqJBkguET74JgLrAxhmyhD5KL' -O work/assets/Ciudad-Neon.jpg
          gdown 'https://drive.google.com/uc?id=1ZVOrfJfAk2QLbnWrbgKdPg807ptgj8HU' -O work/lineart/Clip03.mp4
          gdown 'https://drive.google.com/uc?id=1fdKJ6mN7h53uInnI4Mq_YesZT6tTZbWe' -O work/lineart/Clip01.mp4
          gdown 'https://drive.google.com/uc?id=1DaOf8AFjlfAXVhLBnW1M8NoupRoQAFz4' -O work/lineart/Clip02.mp4
          gdown 'https://drive.google.com/uc?id=1E0md2g-jjzUIrULRTnLPAbY2QDDwDaYy' -O work/clips/02.mp4
          gdown 'https://drive.google.com/uc?id=1lw4mD2WU1LrB-rBV2hr7qQ1JMiHmfPFL' -O work/clips/13.mp4
          gdown 'https://drive.google.com/uc?id=1-CY58uo9K0Pu7dlK4VA84SeUTi1SfjES' -O work/clips/18.mp4
          gdown 'https://drive.google.com/uc?id=1Uun4egaerhq8fLHisGzeHLU-4fp-Jkl5' -O work/clips/22.mp4
          gdown 'https://drive.google.com/uc?id=1VbOzbT2IQL6WNGOLowSK7CJhb6BBUyOr' -O work/clips/24.mp4
          gdown 'https://drive.google.com/uc?id=1cRrpEKrZKybLa22BJZAAkrKhslvYbOMI' -O work/sfx-pack.zip
          unzip -oq work/sfx-pack.zip -d work/sfx
      - name: Download official Rockstar GTA VI media and screenshot cutaways
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://media-rockstargames-com.akamaized.net/VI/downloads/videos/GTAVI_Videos.zip' -o work/media/GTAVI_Videos.zip
          unzip -oq work/media/GTAVI_Videos.zip -d work/rockstar/clips
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Jason_and_Lucia_01.0naeahss9-1x6.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Jason_and_Lucia_01.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Jason_and_Lucia_02.0uig00eojlokf.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Jason_and_Lucia_02.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Jason_and_Lucia_03.15z-.c0tptrzs.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Jason_and_Lucia_03.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Jason_Duval_11.019l5gj6~0~0v.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Jason_Duval_11.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Vice_City_13.0iq8ff474tsdx.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Vice_City_13.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Vice_City_14.0fu8u9jh5hkg7.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Vice_City_14.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Vice_City_15.11tb0mz68edqo.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Vice_City_15.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Vice_City_16.16hjjmnxqg9mv.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Vice_City_16.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Vice_City_20.18c75478u52nf.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Vice_City_20.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Leonida_Keys_07.0z9tb69ssp4rq.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Leonida_Keys_07.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Port_Gellhorn_07.053ldlg0m.2r..jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Port_Gellhorn_07.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Grassrivers_07.0txitddjiq5o1.jpg?akim=1&imdensity=1&imwidth=3840' -o work/stills/Grassrivers_07.jpg
          curl -fL --retry 3 'https://media-rockstargames-com.akamaized.net/tina-uploads/tina-modules/gta-v/911bff9fca5209b94dd22bcba795eefdd4b71993.jpg' -o work/stills/gta5-official.jpg
          echo '--- OFFICIAL MEDIA ---'
          find work/rockstar/clips work/stills -maxdepth 1 -type f | sort
      - name: Render first four scenes with direct FFmpeg editing
        run: python scripts/render_r8_ffmpeg.py
      - name: Validate MP4 and create review sheet
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 work/out/GTA6-ZINKO-R8-Scenes-1-4-FFmpeg.mp4
          test -s work/out/GTA6-ZINKO-R8-Scenes-1-4-FFmpeg.mp4
          ffmpeg -y -loglevel error -i work/out/GTA6-ZINKO-R8-Scenes-1-4-FFmpeg.mp4 -vf "fps=1,scale=480:270,tile=4x3" -frames:v 1 work/out/contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-ZINKO-R8-Scenes-1-4-FFmpeg
          path: |
            work/out/GTA6-ZINKO-R8-Scenes-1-4-FFmpeg.mp4
            work/out/contact-sheet.jpg
          retention-days: 14
