name: What If GTA 6 — Remotion visual proof
on:
  push:
    branches: [feat/what-if-gta6-stickman-film]
    paths:
      - 'src/what-if-gta6/**'
      - 'src/Root.tsx'
      - '.github/workflows/what-if-gta6-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: what-if-gta6-preview
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Ensure Remotion Chromium
        run: npx remotion browser ensure
      - name: Render first three complete scenes (30 seconds)
        run: |
          mkdir -p out
          npx remotion render src/index.ts WhatIfGTA6Film out/WHAT-IF-GTA6-PROOF.mp4 --frames=0-899 --codec=h264 --crf=18 --pixel-format=yuv420p --concurrency=3
          ffmpeg -v error -i out/WHAT-IF-GTA6-PROOF.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,r_frame_rate -of json out/WHAT-IF-GTA6-PROOF.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: WHAT-IF-GTA6-PROOF
          path: out/WHAT-IF-GTA6-PROOF.mp4
          if-no-files-found: error
          retention-days: 14
