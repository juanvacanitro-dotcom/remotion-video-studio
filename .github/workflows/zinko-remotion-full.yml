name: Render Zinko full intro
on:
  push:
    branches: [codex/zinko-remotion-full]
    paths: ['src/zinko-proof/**', 'public/zinko-full/**', '.github/workflows/zinko-remotion-full.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zinko-remotion-full
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx remotion browser ensure
      - run: npx remotion render src/zinko-proof/index.tsx ZinkoRemotionFull out/GTA6-inicio-Remotion.mp4 --concurrency=2 --crf=18 --pixel-format=yuv420p --audio-bitrate=256k
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-inicio-Remotion
          path: out/GTA6-inicio-Remotion.mp4
          if-no-files-found: error
          retention-days: 14
