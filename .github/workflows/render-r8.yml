name: Render GTA 6 R8 preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/render-r8.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx remotion browser ensure
      - run: npm run render:r8
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-R8-preview
          path: out/GTA6-R8-preview.mp4
          if-no-files-found: error
          retention-days: 7
