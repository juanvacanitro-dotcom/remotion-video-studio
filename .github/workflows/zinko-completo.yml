name: Render Zinko full review with creator voice
on:
  push:
    branches: [codex/zinko-resenas-completo]
    paths: ['src/zinko-completo/**', 'public/zinko-completo/**', '.github/workflows/zinko-completo.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zinko-resenas-completo
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx remotion browser ensure
      - run: npx remotion render src/zinko-completo/index.tsx ZinkoCompleto out/ZINKO-GTA6-Completo-Mi-Voz.mp4 --concurrency=2 --crf=18 --pixel-format=yuv420p --audio-bitrate=256k
      - uses: actions/upload-artifact@v4
        with:
          name: ZINKO-GTA6-Completo-Mi-Voz
          path: out/ZINKO-GTA6-Completo-Mi-Voz.mp4
          if-no-files-found: error
          retention-days: 14
