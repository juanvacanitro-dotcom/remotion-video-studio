name: Fetch official GTA VI media for ZINKO edit
on:
  push:
    branches: [codex/zinko-gta6-real-footage]
    paths: ['.github/workflows/zinko-gta6-real-footage.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zinko-gta6-real-footage
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Rockstar official video clips and selected screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/rockstar/videos out/rockstar/stills
          curl -fL --retry 3 --retry-delay 2 'https://media-rockstargames-com.akamaized.net/VI/downloads/videos/GTAVI_Videos.zip' -o /tmp/GTAVI_Videos.zip
          unzip -q /tmp/GTAVI_Videos.zip -d out/rockstar/videos
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Jason_Duval_16.090yj-lyddyrr.jpg?akim=1&imdensity=1&imwidth=1920' -o out/rockstar/stills/jason_duval_16.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Port_Gellhorn_01.0fmisvza-5-cq.jpg?akim=1&imdensity=1&imwidth=1920' -o out/rockstar/stills/port_gellhorn_01.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Ambrosia_04.0.2cefoguu-tt.jpg?akim=1&imdensity=1&imwidth=1920' -o out/rockstar/stills/ambrosia_04.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Leonida_Keys_06.0eapr3hbeyewx.jpg?akim=1&imdensity=1&imwidth=1920' -o out/rockstar/stills/leonida_keys_06.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Vice_City_24.0r9tor5-x.p75.jpg?akim=1&imdensity=1&imwidth=1920' -o out/rockstar/stills/vice_city_24.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Jason_and_Lucia_05.0ypw_.fz.~4k0.jpg?akim=1&imdensity=1&imwidth=1920' -o out/rockstar/stills/jason_and_lucia_05.jpg
          curl -fL --retry 3 'https://www.rockstargames.com/VI/_next/static/media/Port_Gellhorn_06.13ghhmb440r6e.jpg?akim=1&imdensity=1&imwidth=1920' -o out/rockstar/stills/port_gellhorn_06.jpg
          echo '--- downloaded official Rockstar media ---'
          find out/rockstar -type f -printf '%p %s bytes\n'
          du -sh out/rockstar
      - uses: actions/upload-artifact@v4
        with:
          name: ZINKO-ROCKSTAR-OFFICIAL-MEDIA
          path: out/rockstar
          if-no-files-found: error
          retention-days: 7
