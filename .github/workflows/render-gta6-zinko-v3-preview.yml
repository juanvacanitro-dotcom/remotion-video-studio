name: GTA 6 ZINKO Motion V4 — Full Visual Edit
on:
  push:
    branches: [feat/gta6-zinko-editorial-v2]
    paths:
      - 'src/gta6-zinko-v2/CompositionV4.tsx'
      - 'src/gta6-zinko-v2/index.tsx'
      - 'src/gta6-zinko-v2/RENDER-V4-FULL.txt'
      - '.github/workflows/render-gta6-zinko-v3-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gta6-zinko-v4-full
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install render and download tools
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install --quiet --upgrade gdown yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Download official Rockstar trailer footage
        run: |
          mkdir -p public/gta6-zinko-v4/media
          yt-dlp --no-warnings --no-playlist --retries 5 --fragment-retries 5 --js-runtimes deno -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o 'public/gta6-zinko-v4/media/launch.%(ext)s' 'https://www.youtube.com/watch?v=rz1B4B2yBZY'
          yt-dlp --no-warnings --no-playlist --retries 5 --fragment-retries 5 --js-runtimes deno -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o 'public/gta6-zinko-v4/media/trailer2.%(ext)s' 'https://www.youtube.com/watch?v=VQRLujxTm3c'
          yt-dlp --no-warnings --no-playlist --retries 5 --fragment-retries 5 --js-runtimes deno -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o 'public/gta6-zinko-v4/media/trailer1.%(ext)s' 'https://www.youtube.com/watch?v=QdBZY2fkU-0'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          folder=Path('public/gta6-zinko-v4/media')
          for name in ['launch.mp4','trailer2.mp4','trailer1.mp4']:
              p=folder/name
              if not p.exists() or p.stat().st_size < 5_000_000:
                  raise SystemExit('Official trailer missing or incomplete: '+name)
              duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)]).decode().strip())
              if duration < 88: raise SystemExit('Trailer duration is unexpectedly short: '+name+' '+str(duration))
              print(name, round(duration,2),'seconds',p.stat().st_size,'bytes')
          PY
      - name: Stage Nico, fonts, original voice and sound effects
        run: |
          mkdir -p public/gta6-zinko-v4/voice public/gta6-zinko-v4/sfx public/gta6-zinko-v4/fonts public/gta6-zinko-v4/nico /tmp/gta-v4-voice /tmp/gta-v4-sfx
          cp public/zinko-proof/Caption.ttf public/gta6-zinko-v4/fonts/Caption.ttf
          cp public/zinko-proof/Impact.ttf public/gta6-zinko-v4/fonts/Impact.ttf
          cp public/zinko-proof/nico-happy.webp public/gta6-zinko-v4/nico/nico-happy.webp
          cp public/zinko-proof/nico-question.webp public/gta6-zinko-v4/nico/nico-question.webp
          gdown '1ETmtPQ0u35WKySVo2HqdKJxhsnFfK3Mj' -O /tmp/gta-v4-voice.zip
          gdown '1BeQ7rkfScTRLBfwsutf7GVO5mP1BMU74' -O /tmp/gta-v4-sfx.zip
          unzip -q -o /tmp/gta-v4-voice.zip -d /tmp/gta-v4-voice
          unzip -q -o /tmp/gta-v4-sfx.zip -d /tmp/gta-v4-sfx
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          voices=list(Path('/tmp/gta-v4-voice').rglob('*.mp3'))
          for n in range(1,19):
              candidates=[p for p in voices if p.stem==str(n) or p.stem==f'{n:02d}' or p.stem.startswith(str(n)+' ') or p.stem.startswith(f'{n:02d} ')]
              if not candidates: raise SystemExit('Missing original narration track '+str(n))
              shutil.copy2(candidates[0],Path('public/gta6-zinko-v4/voice')/f'{n:02d}.mp3')
          sounds=list(Path('/tmp/gta-v4-sfx').rglob('*.wav'))
          if not sounds: raise SystemExit('Sound effects archive contains no WAV files')
          patterns={'hit':r'(hit|impact|golpe|punch|bass)','whoosh':r'(whoosh|swoosh|barrido|swipe)','pop':r'(pop|click|bubble|burbuja|tap)'}
          for name,pattern in patterns.items():
              match=next((p for p in sounds if re.search(pattern,p.stem,re.I)),sounds[0])
              shutil.copy2(match,Path('public/gta6-zinko-v4/sfx')/(name+'.wav'))
              print(name,'<-',match.name)
          print('Staged 18 original narration tracks and 3 SFX.')
          PY
      - name: Type-check V4
        run: npx tsc --noEmit
      - name: Render full 3-minute video
        run: |
          mkdir -p out
          npx remotion render src/gta6-zinko-v2/index.tsx GTA6ZinkoMotionV4 out/GTA6-ZINKO-MOTION-V4-FULL.mp4 --codec=h264 --crf=18 --audio-bitrate=256k --concurrency=4
          ffprobe -v error -show_entries format=duration,size -of json out/GTA6-ZINKO-MOTION-V4-FULL.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-ZINKO-MOTION-V4-FULL
          path: out/GTA6-ZINKO-MOTION-V4-FULL.mp4
          if-no-files-found: error
          retention-days: 7
